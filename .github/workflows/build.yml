
name: Build ESP32-S3 Firmware

on:
  push:
    paths-ignore:          # Worker-only changes must not rebuild or republish firmware
      - 'cloud/**'
      - '.github/workflows/deploy-cloud.yml'
  workflow_dispatch:

permissions:
  contents: write   # needed to publish OTA releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio esptool

      - name: Build firmware
        run: pio run -e esp32s3

      - name: Create merged firmware
        run: |
          esptool --chip esp32s3 merge-bin \
            -o merged-firmware.bin \
            --flash-mode dio \
            --flash-freq 80m \
            --flash-size 16MB \
            0x0 .pio/build/esp32s3/bootloader.bin \
            0x8000 .pio/build/esp32s3/partitions.bin \
            0x10000 .pio/build/esp32s3/firmware.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-WiFi-Scanner
          path: |
            merged-firmware.bin
            .pio/build/esp32s3/firmware.bin

      - name: Publish OTA release (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP '#define FW_VERSION "\K[^"]+' src/main.cpp)
          cp .pio/build/esp32s3/firmware.bin firmware.bin
          SHA=$(sha256sum firmware.bin | cut -d' ' -f1)
          SIZE=$(stat -c%s firmware.bin)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VER}/firmware.bin"
          printf '{"version":"%s","size":%s,"sha256":"%s","url":"%s","commit":"%s"}\n' \
            "$VER" "$SIZE" "$SHA" "$URL" "${GITHUB_SHA::7}" > manifest.json
          cat manifest.json
          if ! gh release view "v$VER" >/dev/null 2>&1; then
            gh release create "v$VER" --title "Firmware v$VER" \
              --notes "Built from ${GITHUB_SHA::7}. OTA: firmware.bin. USB: merged-firmware.bin at 0x0." --latest
          fi
          gh release upload "v$VER" firmware.bin merged-firmware.bin manifest.json --clobber

      - name: Publish test build (other branches, never used by OTA)
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP '#define FW_VERSION "\K[^"]+' src/main.cpp)
          TAG="test-${GITHUB_REF_NAME//\//-}"
          cp .pio/build/esp32s3/firmware.bin firmware.bin
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "TEST v$VER ($GITHUB_REF_NAME)" \
              --notes "Test build - not offered by OTA. Upload firmware.bin on the board's Firmware page."
          gh release edit "$TAG" --prerelease --title "TEST v$VER (${GITHUB_SHA::7})"
          gh release upload "$TAG" firmware.bin merged-firmware.bin --clobber
