name: Deploy remote access (Cloudflare)

# Deploys only the Cloudflare Worker. It never builds or publishes firmware.
on:
  push:
    paths:
      - 'cloud/**'
      - '.github/workflows/deploy-cloud.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Worker code
        run: cp cloud/worker/src/index.js /tmp/check.mjs && node --check /tmp/check.mjs

      - name: Skip (Cloudflare secrets not set yet)
        if: env.HAS_CF != 'true'
        run: echo "Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, NETDIAG_DEVICE_KEY and NETDIAG_REMOTE_PASSWORD in Settings > Secrets > Actions, then run this workflow again."

      - name: Deploy Worker and secrets
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloud/worker
          secrets: |
            DEVICE_KEY
            REMOTE_PASSWORD
        env:
          DEVICE_KEY: ${{ secrets.NETDIAG_DEVICE_KEY }}
          REMOTE_PASSWORD: ${{ secrets.NETDIAG_REMOTE_PASSWORD }}
